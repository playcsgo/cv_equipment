services:
  - type: web
    name: gear-demo
    runtime: node
    plan: free
    region: singapore
    buildCommand: npx --yes pnpm@12.5.1 install --frozen-lockfile
    startCommand: ./node_modules/.bin/pm2-runtime ecosystem.config.js --env production
    healthCheckPath: /readyz
    envVars:
      - key: NODE_ENV
        value: production
      - key: SESSION_SECRET
        generateValue: true
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: gear-demo-sessions
          property: connectionString
      - key: MONGODB_URI
        sync: false
      - key: CLOUDAMQP_URL
        sync: false
  - type: keyvalue
    name: gear-demo-sessions
    plan: free
    region: singapore
    ipAllowList: []
